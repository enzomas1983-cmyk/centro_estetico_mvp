name: Deploy to Vercel

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Print source file
        run: |
            echo "=== LINES 310-325 ==="
            sed -n '310,325p' lib/pages/guest_booking_page.dart

      - name: Clean dart cache
        run: rm -rf ~/.pub-cache

      - name: Reinstall dependencies
        run: flutter pub get

      - name: Build web
        run: flutter build web --release

      - name: Check build content
        run: |
          grep -c "DEBUG SERVICE" build/web/main.dart.js && echo "DEBUG SERVICE FOUND" || echo "DEBUG SERVICE NOT FOUND"
          grep -c "I tuoi dati" build/web/main.dart.js && echo "I TUOI DATI FOUND" || echo "I TUOI DATI NOT FOUND"

      - name: Check source code
        run: |
          grep -rn "DEBUG SERVICE" lib/ || echo "NOT FOUND IN SOURCE"
          grep -rn "I tuoi dati" lib/ || echo "NOT FOUND IN SOURCE"
          
      - name: Find DEBUG SERVICE context
        run: grep -n "DEBUG SERVICE" build/web/main.dart.js | head -5

      - name: Find surrounding code
        run: grep -n "AVAILABLE SLOTS\|DEBUG SERVICE\|Prenota online\|I tuoi dati" build/web/main.dart.js

      - name: Search AVAILABLE SLOTS in source
        run: grep -rn "AVAILABLE SLOTS" lib/ || echo "NOT FOUND"

      - name: Find all dart files with service
        run: |
            grep -rn "SERVICE" lib/ | grep -v "//\|debugPrint\|serviceName\|service_\|ServiceModel\|CustomerService\|SupabaseService\|AuthService\|services\|serviceId\|selectedService\|durationMap\|loadService" || echo "NOT FOUND"  

      - name: Search everywhere
        run: grep -rn "DEBUG SERVICE" . --include="*.dart" --exclude-dir=".git" || echo "NOT FOUND ANYWHERE"

      - name: Search GuestBookingPage in build
        run: grep -c "GuestBookingPage\|guest_booking\|PublicBookingPage" build/web/main.dart.js || echo "NOT FOUND"

      - name: Show booking_page content
        run: grep -n "DEBUG SERVICE\|debug.*service\|Text.*service" lib/pages/booking_page.dart || echo "NOT FOUND"

      - name: Search DEBUG in all dart files
        run: grep -rn "\"DEBUG" lib/ || echo "NOT FOUND"

      - name: Search DEBUG SERVICE in Flutter SDK
        run: grep -rn "DEBUG SERVICE" $FLUTTER_ROOT/packages/ --include="*.dart" | head -10 || echo "NOT FOUND IN SDK"  

      - name: Show DEBUG SERVICE full context
        run: sed -n '56080,56110p' build/web/main.dart.js

      - name: Copy vercel.json
        run: cp web/vercel.json build/web/vercel.json

      - name: Deploy to Vercel
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          npm i -g vercel@latest
          cd build/web
          vercel --token $VERCEL_TOKEN --prod --yes